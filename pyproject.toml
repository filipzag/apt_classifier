[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "apt-classifier"
version = "0.1.0"
description = "Evidence-driven APT attribution assistant using MITRE ATT&CK"
requires-python = ">=3.11,<3.14"

[tool.setuptools.packages.find]
include = ["apt_classifier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
